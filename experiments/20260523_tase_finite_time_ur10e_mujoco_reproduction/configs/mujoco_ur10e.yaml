    - shoulder_pan_joint
    - shoulder_lift_joint
    - elbow_joint
    - wrist_1_joint
    - wrist_2_joint
    - wrist_3_joint
  joint_limit_rad:
    source: "v1_from_ur_description_typical_ur10e_range_pending_parse"
