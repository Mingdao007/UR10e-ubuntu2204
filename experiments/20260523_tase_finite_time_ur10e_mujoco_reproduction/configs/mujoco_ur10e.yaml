v1:
  model_status: "v1_approximation_not_calibrated"
  tcp_status: "unverified_tcp_guess"

ur10e_mujoco:
  mjcf_path: "assets/mjcf/ur10e_nominal.xml"
  urdf_nominal_path: "assets/urdf/ur10e_nominal.urdf"
  timestep_s: 0.002
  smoke_duration_s: 2.0
  qdot_limit_initial_rad_s: 0.05
  qdot_limit_after_sim_validation_rad_s: 0.15
  force_ladder_N: [0.5, 1.0, 2.0, 5.0]
