    upper: [6.283185307, 6.283185307, 3.141592654, 6.283185307, 6.283185307, 6.283185307]
  joint_velocity_limit_rad_s:
    source: "v1_safe_initial_override"
    lower: [-0.05, -0.05, -0.05, -0.05, -0.05, -0.05]
    upper: [0.05, 0.05, 0.05, 0.05, 0.05, 0.05]
  contact:
