  #======    OnRobot Engine Messages    ======#
  
  of_hex_sensor_error_title="OnRobot - Sensor error"
  of_hex_sensor_error_type="No or unknown sensor connected.<br>Refer to the Compute Box Description on the OnRobot USB drive."
  of_hex_sensor_error_mixed="The sensor type is not matching with the URCap mode.<br>Please make sure at the Installation tab that proper Compute Box and Sensor/Gripper settings are set, then restart the robot if needed."
  of_hex_sensor_warning_title="OnRobot - Sensor warning: "
  of_hex_sensor_else_error="Unknown error code(s).<br>Connect to the Compute Box Web Access, and analize the STATUS word. Refer to the Compute Box Description on the OnRobot USB drive."
  of_hex_sensor_status_msg="Sensor status: "
  of_hex_sensor_bit0_error="No sensor connected.<br>Turn off the Compute Box, connect the sensor to the Compute Box with an undamaged cable, turn on the Compute Box. If the error persists, contact your distributor."
  of_hex_sensor_bit1_error="Sensor is not responding.<br>Turn off the Compute Box, connect the Sensor to the Compute Box with an undamaged cable, turn on the Compute Box. If the error persists, contact your distributor."
  of_hex_sensor_bit2_error="Sensor failure.<br>Gather information about the situation in which this error occurred, and contact your distributor."
  of_hex_sensor_bit3_error="Sensor power or EEPROM error.<br>Gather information about the situation in which this error occurred, and contact your distributor, or OnRobot."
  of_hex_sensor_bit4_error="Communication error between the sensor and the Compute Box.<br>Turn off the Compute Box, connect the sensor to the Compute Box with an undamaged cable, turn on the Compute Box. If the error persists, contact your distributor."
  of_hex_sensor_bit5_error="Sensor force overload error.<br>Eliminate the circumstances that cause the sensor to be overloaded, that is, offload the sensor."
  of_hex_sensor_bit6_error="Sensor torque overload error.<br>Eliminate the circumstances that cause the sensor to be overloaded, that is, offload the sensor."
  of_hex_sensor_bit7_warning="Sensor overload warning reached. Lower the force/torque to avoid damage."
  of_hex_sensor_bit8_error="Sensor overload limit activated.<br>Lower the force/torque to avoid damage.<br>Program stopped."
  
  #======    End of OnRobot Engine Messages    ======#
