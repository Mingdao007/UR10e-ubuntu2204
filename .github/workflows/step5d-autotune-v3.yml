name: Step5d Autotune v3 fast gate

on:
  pull_request:
    paths:
      - ".github/pull_request_template.md"
      - ".github/workflows/step5d-autotune-v3.yml"
      - "experiments/tase-contact-reproduction/REFACTORING_CONTRACT.md"
      - "experiments/tase-contact-reproduction/STEP5_FLOW.md"
      - "experiments/tase-contact-reproduction/tools/step5d_autotune_v3/**"
      - "experiments/tase-contact-reproduction/tools/validate_step5d_autotune_v3_refactor.py"
      - "experiments/tase-contact-reproduction/scripts/step5d-autotune-v3.sh"
      - "experiments/tase-contact-reproduction/config/step5d_autotune_v3*.json"
      - "experiments/tase-contact-reproduction/config/step5/**"
      - "experiments/tase-contact-reproduction/config/step5_stage_table.json"
      - "experiments/tase-contact-reproduction/config/systemd/step5d-autotune-v3.service"
      - "experiments/tase-contact-reproduction/config/step5d_autotune_controller_readback_v2.json"
      - "experiments/tase-contact-reproduction/tests/test_step5d_autotune_v3_*.py"
      - "experiments/tase-contact-reproduction/tests/step5d_v3_fake_bridge_harness.py"
      - "experiments/tase-contact-reproduction/tests/step5d_v3_parser_ci_stubs.py"
      - "experiments/tase-contact-reproduction/tools/export_step5d_autotune_v2_attempt_ledger.py"
      - "experiments/tase-contact-reproduction/tools/verify_step5d_autotune_v3_artifacts.py"
      - "experiments/tase-contact-reproduction/tools/verify_step5d_autotune_v3_g10.py"
      - "experiments/tase-contact-reproduction/tools/run_step5d_autotune_v3_ursim_hold_gate.py"
      - "experiments/tase-contact-reproduction/programs/step5/step5d/step5d_strict_rnn_autotune_v2.*"
      - "experiments/tase-contact-reproduction/tools/kunwei_rtde_bridge.py"
      - "experiments/tase-contact-reproduction/tools/step5d_p0_v9_control_core.py"
      - "experiments/tase-contact-reproduction/tools/step5d_p0_v9_bridge.py"
      - "experiments/tase-contact-reproduction/tools/step5d_autotune_contract.py"
      - "experiments/tase-contact-reproduction/tools/run_step5d_autotune_campaign.py"
      - "experiments/tase-contact-reproduction/tools/step5d_autotune_coordinator.py"
      - "experiments/tase-contact-reproduction/tools/step5d_autotune_journal.py"
      - "experiments/tase-contact-reproduction/tools/step5d_autotune_store.py"
      - "experiments/tase-contact-reproduction/tools/step5d_autotune_live_driver.py"
      - "experiments/tase-contact-reproduction/tools/step5d_runtime_interface.py"
      - "experiments/tase-contact-reproduction/tools/step5d_paper_outer_loop.py"
      - "experiments/tase-contact-reproduction/tools/step5d_control_contract.py"
      - "experiments/tase-contact-reproduction/tools/contact_semantics.py"
      - "experiments/tase-contact-reproduction/tools/build_step5d_autotune_tp.py"
      - "experiments/tase-contact-reproduction/scripts/bridge-line-operator.sh"
      - "experiments/tase-contact-reproduction/scripts/step5d-autotune-live.sh"
      - "experiments/tase-contact-reproduction/config/step5_safe_frame.json"
      - "experiments/tase-contact-reproduction/config/step5d_autotune_campaign_v1.json"
      - "experiments/tase-contact-reproduction/config/step5d_autotune_i_scale_sanity_v1.json"
      - "experiments/tase-contact-reproduction/config/current_stage.json"
      - "experiments/tase-contact-reproduction/programs/step5/step5d/step5d_strict_rnn_autotune_v1.script"
      - "experiments/tase-contact-reproduction/programs/step5/step5d/step5d_strict_rnn_autotune_v1.txt"
      - "experiments/tase-contact-reproduction/programs/step5/step5d/step5d_strict_rnn_autotune_v1.urp"

permissions:
  contents: read

concurrency:
  group: step5d-autotune-v3-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  hermetic-fast:
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      STEP5D_V3_HERMETIC_PARSER_CI: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      STEP5D_V3_PR_BODY: ${{ github.event.pull_request.body }}
    steps:
      - name: Checkout full baseline and tags
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Install pinned test runner
        run: >-
          python3 -m pip install --disable-pip-version-check --no-input
          -r experiments/tase-contact-reproduction/requirements-test.txt

      - name: Validate declaration, frozen v1, budget, and matrix
        run: >-
          python3
          experiments/tase-contact-reproduction/tools/validate_step5d_autotune_v3_refactor.py
          --root experiments/tase-contact-reproduction
          --declaration-env STEP5D_V3_PR_BODY

      - name: Run Small and hermetic Medium tests only
        working-directory: experiments/tase-contact-reproduction
        run: |
          python3 -m pytest -q \
            tests/test_step5d_autotune_v3_contract.py \
            tests/test_step5d_autotune_v3_attempt_ledger.py \
            tests/test_step5d_autotune_v3_artifacts.py \
            tests/test_step5d_autotune_v3_g10.py \
            tests/test_step5d_autotune_v3_refactor_gate.py \
            tests/test_step5d_autotune_v3_service.py \
            tests/test_step5d_autotune_v3_acceptance.py \
            tests/test_step5d_autotune_recovery.py \
            tests/test_step5d_autotune_journal.py \
            tests/test_step5d_autotune_campaign_runner.py \
            tests/test_step5d_autotune_live_driver.py \
            tests/test_step5d_autotune_v3_ursim_hold.py
